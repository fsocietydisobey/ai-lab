[project]
name = "mnemosyne"
version = "0.1.0"
description = "Persistent domain memory for khimaira lead sessions — LoRA fine-tune + query service"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0",
    "accelerate>=0.34.0",
    "datasets>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
]

[project.scripts]
mnemosyne = "mnemosyne.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemosyne"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
